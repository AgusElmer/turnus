  services:
    db:
      image: postgres:16-alpine
      restart: unless-stopped
      environment:
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_DB: ${POSTGRES_DB}
      # no external port; or, if you need psql from host, limit it:
      # ports: ["127.0.0.1:5432:5432"]
      volumes:
        - postgres_data:/var/lib/postgresql/data

    api:
      build:
        context: .
        dockerfile: backend/Turnus.Api/Dockerfile
      restart: unless-stopped
      environment:
        ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
        ConnectionStrings__Default: ${ConnectionStrings__Default}
        Authentication__Google__ClientId: ${Authentication__Google__ClientId}
        Authentication__Google__AllowedEmails__0: ${Authentication__Google__AllowedEmails__0}
        Authentication__Google__AllowedEmails__1: ${Authentication__Google__AllowedEmails__1}
        Authentication__Google__AllowedEmails__2: ${Authentication__Google__AllowedEmails__2}
        Database__SeedDemoData: ${Database__SeedDemoData}
      ports:
        - "127.0.0.1:8080:8080"   # only host can reach
      depends_on:
        - db

    web:
      build:
        context: frontend
        dockerfile: Dockerfile
        args:
          VITE_API_BASE_URL: ${VITE_API_BASE_URL}
          VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
          VITE_ALLOWED_EMAILS: ${VITE_ALLOWED_EMAILS:-}
      restart: unless-stopped
      ports:
        - "127.0.0.1:5173:80"     # only host can reach
      depends_on:
        - api

  volumes:
    postgres_data:
